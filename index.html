<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>翻譯年糕</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="翻譯年糕">
<meta name="theme-color" content="#2b5d8a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18232e; --muted:#5d6b78; --line:#dde3e9;
  --accent:#2b5d8a; --accent-ink:#ffffff; --hl:#ffe98a; --hl-ink:#3a2f00;
  --them:#ffffff; --me:#dbe8f4; --warn:#b3422f; --amber:#b7791f; --amber-bg:#fff4dc;
  --f-display:"LXGW WenKai TC","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10161c; --surface:#18212a; --ink:#e6edf3; --muted:#93a2b1; --line:#2a3642;
  --accent:#7fb2e0; --accent-ink:#0d1a26; --hl:#5c4f12; --hl-ink:#fff3c2;
  --them:#1d2833; --me:#1e3448; --warn:#f08a74; --amber:#f0b95a; --amber-bg:#3a2f16; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.7rem;margin:0;letter-spacing:.02em}
h1 span{background:linear-gradient(transparent 58%,var(--hl) 58%);padding:0 2px}
.sub{color:var(--muted);margin:2px 0 0;font-size:.9rem}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:9px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
textarea,input[type=password],input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:10px}
textarea{min-height:92px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.5;cursor:default}
.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:500}
.sr{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{position:relative}
.thumb img{width:56px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.thumb button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:13px;line-height:22px;padding:0;cursor:pointer}
select{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:6px 8px;max-width:100%}
.status{font-size:.9rem;color:var(--muted);min-height:1.2em}
.status.err{color:var(--warn)}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;border-radius:14px;padding:9px 12px;border:1px solid var(--line);min-width:0}
.msg.them{align-self:flex-start;background:var(--them);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.orig{font-size:.86rem;color:var(--muted);word-break:break-word}
.tr{margin-top:3px;word-break:break-word}
.tr mark{background:var(--hl);color:var(--hl-ink);padding:0 3px;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.note{margin-top:4px;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:4px}
.summary{font-family:var(--f-display);font-size:1.02rem}
.opt{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.opt:first-child{border-top:0;padding-top:0}
.opt .say{font-size:1.08rem;word-break:break-word}
.opt .roman{font-size:.82rem;color:var(--muted);font-style:italic}
.opt .back{font-size:.85rem;color:var(--muted)}
.copy{align-self:flex-start;font-size:.82rem;padding:5px 10px}
.example{font-family:var(--f-mono);font-size:.7rem;background:var(--hl);color:var(--hl-ink);border-radius:4px;padding:1px 6px}
.tip{font-size:.85rem;color:var(--muted);background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.foot{justify-content:center;gap:16px}
.usage-row{display:flex;flex-direction:column;gap:4px}
.usage-top{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.usage-top b{font-variant-numeric:tabular-nums;font-weight:500}
.meter{height:8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.meter span{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .4s}
.meter.warn span{background:var(--amber)}
.meter.full span{background:var(--warn)}
.fine{font-size:.8rem;color:var(--muted);margin:0}
.ver{text-align:center;font-family:var(--f-mono);font-size:.72rem}
.banner{border-radius:12px;padding:10px 12px;font-size:.9rem;background:var(--amber-bg);color:var(--ink);border:1px solid var(--amber)}
.banner.full{border-color:var(--warn)}
.engine{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:.85rem;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.msg{animation:in .25s ease-out both}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>翻譯年糕</span></h1>
    <p class="sub">上傳對話截圖翻成中文，再把你的回覆翻成對方的語言</p>
  </header>

  <div class="banner" id="usageBanner" role="status" hidden></div>

  <!-- 通關密碼 -->
  <section class="card" id="passCard" hidden>
    <div class="label">第一次使用</div>
    <div>輸入朋友給你的通關密碼，之後這支手機就不用再輸入。</div>
    <p class="fine">翻譯年糕是朋友間共用的額度，每一次翻譯都會實際花錢（截圖約 NT$0.2、文字約 NT$0.1），請在需要時再用。訊息會送到 AI 服務翻譯，請不要拿來翻密碼、身分證、銀行或其他敏感資料。</p>
    <input id="passInput" type="password" autocomplete="off" placeholder="通關密碼">
    <div class="row"><button class="btn" id="passSave">開始使用</button></div>
    <div class="status" id="passStatus"></div>
  </section>

  <div class="tabs" role="tablist">
    <button id="tab-read" role="tab" aria-selected="true">看懂對方</button>
    <button id="tab-reply" role="tab" aria-selected="false">回覆對方</button>
  </div>

  <!-- 看懂對方 -->
  <section id="p-read" class="panel">
    <div class="card">
      <div class="label">貼上文字或截圖</div>
      <textarea id="readText" placeholder="把對方的訊息貼在這裡，也可以直接貼上截圖"></textarea>
      <div class="thumbs" id="thumbs"></div>
      <div class="row">
        <input id="file" type="file" accept="image/*" multiple class="sr">
        <button class="btn ghost" id="uploadBtn" type="button">上傳截圖</button>
        <button class="btn" id="readBtn" type="button">翻譯成中文</button>
      </div>
      <div class="status" id="readStatus"></div>
    </div>

    <div class="card">
      <div class="meta">
        <span class="label">翻譯結果</span>
        <span class="row"><span class="example" id="exampleTag">範例</span><span class="tag" id="engineTag" hidden></span><span class="tag" id="langTag">英文</span></span>
      </div>
      <div class="summary" id="summary"></div>
      <div class="chat" id="chat"></div>
    </div>
  </section>

  <!-- 回覆對方 -->
  <section id="p-reply" class="panel" hidden>
    <div class="card">
      <div class="label">你想說的話（中文）</div>
      <textarea id="replyText" placeholder="例如：謝謝你！我下週也會去，到時候見～"></textarea>
      <div class="row">
        <select id="lang" aria-label="目標語言">
          <option value="auto">跟對方同語言</option>
          <option>英文</option><option>日文</option><option>韓文</option><option>泰文</option>
          <option>越南文</option><option>印尼文</option><option>馬來文</option><option>菲律賓文</option>
          <option>西班牙文</option><option>法文</option><option>德文</option>
        </select>
        <select id="tone" aria-label="語氣">
          <option>自然口語</option><option>可愛親切</option><option>禮貌正式</option>
        </select>
        <select id="gender" aria-label="口吻">
          <option value="">口吻不指定</option>
          <option value="f">女生口吻</option>
          <option value="m">男生口吻</option>
        </select>
      </div>
      <div class="row"><button class="btn" id="replyBtn" type="button">幫我翻</button></div>
      <div class="status" id="replyStatus"></div>
    </div>
    <div class="card" id="optCard" hidden>
      <div class="meta"><span class="label">可以這樣回</span><span class="row"><span class="tag" id="optEngine" hidden></span><span class="tag" id="optLang"></span></span></div>
      <div id="opts"></div>
    </div>
  </section>

  <section class="card" id="usageCard" hidden>
    <div class="label">共用額度</div>
    <div class="usage-row">
      <div class="usage-top"><span>今天已翻譯</span><b id="uToday"></b></div>
      <div class="meter" id="mToday"><span></span></div>
    </div>
    <div class="usage-row">
      <div class="usage-top"><span>本月估算費用</span><b id="uMonth"></b></div>
      <div class="meter" id="mMonth"><span></span></div>
    </div>
    <p class="fine" id="uDetail"></p>
    <p class="fine">每次翻譯都會花錢，大家共用同一個額度。請不要翻譯密碼、身分證、銀行等敏感資料。</p>
  </section>

  <div class="tip" id="installTip" hidden></div>
  <div class="foot row">
    <label class="engine" for="engine">翻譯引擎
      <select id="engine">
        <option value="">預設</option>
        <option value="claude">Claude</option>
        <option value="gemini">Gemini</option>
      </select>
    </label>
    <button class="link" id="changePass" type="button">更換通關密碼</button>
  </div>
  <p class="fine ver" id="version"></p>
</div>

<script src="version.js"></script>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const API_URL = (window.APP_CONFIG || {}).API_URL;
let files = [];
let lastLang = "英文";
let context = [];

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};

const EXAMPLE = {
  lang:"英文",
  summary:"對方稱讚你的貼文，問照片在哪裡拍的，想約週末一起去。",
  messages:[
    {side:"them",original:"omg this pic is literally so pretty 😭 where was this??",translation:"天啊這張照片真的太美了😭 這是在哪裡拍的？？",note:"😭 在這裡是「美到哭」的誇張讚美，不是難過。"},
    {side:"me",original:"thank u!! it's Jiufen, near Taipei",translation:"謝謝！這是九份，在台北附近"},
    {side:"them",original:"no way ngl i'd love to go sometime, u free this wknd?",translation:"真的假的，老實說我也好想找時間去，你這週末有空嗎？",note:"ngl = not gonna lie（老實說）；wknd = weekend。"}
  ]
};

/* ---------- 分頁 ---------- */
function setTab(which){
  const read = which === "read";
  $("tab-read").setAttribute("aria-selected", read);
  $("tab-reply").setAttribute("aria-selected", !read);
  $("p-read").hidden = !read; $("p-reply").hidden = read;
}
$("tab-read").onclick = () => setTab("read");
$("tab-reply").onclick = () => setTab("reply");

/* ---------- 通關密碼 ---------- */
function needPass(msg){
  $("passCard").hidden = false;
  $("passStatus").className = "status" + (msg ? " err" : "");
  $("passStatus").textContent = msg || "";
  $("passInput").focus();
}
$("passSave").onclick = () => {
  const v = $("passInput").value.trim();
  if(!v){ needPass("請輸入通關密碼。"); return; }
  store.set("pass", v); $("passCard").hidden = true; $("passInput").value = "";
  loadUsage();
};
$("changePass").onclick = () => { store.del("pass"); needPass(""); };
if(!store.get("pass")) needPass("");

/* ---------- 偏好 ---------- */
["gender","tone","engine"].forEach(id => {
  const v = store.get(id); if(v !== null) $(id).value = v;
  $(id).onchange = () => store.set(id, $(id).value);
});

/* ---------- 顯示結果 ---------- */
function renderResult(r, isExample){
  $("exampleTag").hidden = !isExample;
  setEngineTag("engineTag", r._engine);
  $("langTag").textContent = r.lang || "—";
  $("summary").textContent = r.summary || "";
  const chat = $("chat"); chat.innerHTML = "";
  (r.messages || []).forEach(m => {
    const d = document.createElement("div");
    d.className = "msg " + (m.side === "me" ? "me" : "them");
    const o = document.createElement("div"); o.className = "orig"; o.textContent = m.original || "";
    const t = document.createElement("div"); t.className = "tr";
    const mk = document.createElement("mark"); mk.textContent = m.translation || ""; t.append(mk);
    d.append(o, t);
    if(m.note){ const n = document.createElement("div"); n.className = "note"; n.textContent = m.note; d.append(n); }
    chat.append(d);
  });
}
renderResult(EXAMPLE, true);

function setEngineTag(id, eng){
  const el = $(id);
  el.hidden = !eng;
  el.textContent = eng === "gemini" ? "Gemini" : eng === "claude" ? "Claude" : "";
}

/* ---------- 圖片 ---------- */
function renderThumbs(){
  const t = $("thumbs"); t.innerHTML = "";
  files.forEach((f, i) => {
    const w = document.createElement("div"); w.className = "thumb";
    const img = document.createElement("img"); img.alt = "截圖 " + (i+1); img.src = URL.createObjectURL(f);
    const x = document.createElement("button"); x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label","移除這張");
    x.onclick = () => { files.splice(i,1); renderThumbs(); };
    w.append(img, x); t.append(w);
  });
}
function addFiles(list){
  const imgs = Array.from(list).filter(f => !f.type || f.type.startsWith("image/"));
  files = files.concat(imgs).slice(0, 4);
  renderThumbs();
  if(imgs.length && Array.from(list).length > 4) status("read", "最多 4 張，只保留前 4 張。", true);
}
$("uploadBtn").onclick = () => $("file").click();
// 選好截圖就自動開始翻譯（可一次選多張）
$("file").onchange = e => {
  const picked = e.target.files;
  if(!picked || !picked.length) return;
  files = [];
  addFiles(picked);
  e.target.value = "";
  if(files.length && store.get("pass")) $("readBtn").click();
};
document.addEventListener("paste", e => {
  const imgs = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith("image/"));
  if(imgs.length){ e.preventDefault(); addFiles(imgs); setTab("read"); }
});

// 縮小圖片再上傳：長邊最多 1568px，省流量也省費用
// 把截圖切成幾段再上傳：長截圖整張縮小會讓字變太小、看不清楚。
// 每段寬度最多 1080px、高度最多 1400px（不會被 AI 再縮小），段與段之間重疊 80px 避免切到字
function loadImage(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image")); };
    img.src = url;
  });
}
async function toTiles(file, maxTiles){
  const img = await loadImage(file);
  const TILE_H = 1400, OVERLAP = 80, MAX_W = 1080;
  let s = Math.min(1, MAX_W / img.naturalWidth);
  let W = Math.round(img.naturalWidth * s), H = Math.round(img.naturalHeight * s);
  // 段數超過上限時，整張再等比例縮小到剛好放得下
  const need = H <= TILE_H ? 1 : Math.ceil((H - OVERLAP) / (TILE_H - OVERLAP));
  if(need > maxTiles){
    const maxH = maxTiles * (TILE_H - OVERLAP) + OVERLAP;
    const k = maxH / H; s *= k; W = Math.round(W * k); H = Math.round(H * k);
  }
  const count = H <= TILE_H ? 1 : Math.ceil((H - OVERLAP) / (TILE_H - OVERLAP));
  const tiles = [];
  for(let i = 0; i < count; i++){
    const y = Math.min(i * (TILE_H - OVERLAP), Math.max(0, H - TILE_H));
    const h = Math.min(TILE_H, H);
    const c = document.createElement("canvas"); c.width = W; c.height = h;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, h);
    ctx.drawImage(img, 0, y / s, img.naturalWidth, h / s, 0, 0, W, h);
    tiles.push({ media_type: "image/jpeg", data: c.toDataURL("image/jpeg", 0.9).split(",")[1] });
  }
  return tiles;
}

/* ---------- 呼叫後端 ---------- */
const ERR = {
  bad_pass: "通關密碼不對，請重新輸入。",
  daily_limit: "今天的共用翻譯次數用完了，明天再來。",
  monthly_budget: "本月的共用額度用完了，下個月 1 號會自動恢復。",
  no_credit: "翻譯服務的儲值額度用完了，請通知管理者儲值。",
  bad_api_key: "翻譯服務的金鑰設定有問題，請通知管理者。",
  busy: "翻譯服務現在比較忙，等幾秒再按一次。",
  rate_limited: "翻譯服務的使用頻率超過上限，等一分鐘再試。",
  bad_model: "翻譯模型名稱設定有誤，請通知管理者。",
  upstream: "翻譯服務暫時出錯，再試一次。",
  bad_output: "結果格式有誤，再按一次試試。",
  bad_request: "內容無法處理，換一張截圖或改貼文字。",
  forbidden: "這個網址沒有被允許使用翻譯服務。",
  server_not_ready: "翻譯服務還沒設定好。",
  network: "連不上翻譯服務，檢查一下網路。",
  refused: "這段內容無法翻譯，換一段試試。",
};
function status(which, msg, err){
  const el = $(which + "Status");
  el.className = "status" + (err ? " err" : ""); el.textContent = msg || "";
}
/* ---------- 用量提示 ---------- */
const ntd = (usd, rate) => "NT$" + (usd * rate < 10 ? (usd * rate).toFixed(1) : Math.round(usd * rate).toLocaleString());
function setMeter(id, ratio){
  const m = $(id);
  m.querySelector("span").style.width = Math.min(100, Math.round(ratio * 100)) + "%";
  m.classList.toggle("warn", ratio >= 0.8 && ratio < 1);
  m.classList.toggle("full", ratio >= 1);
}
function showVersion(server){
  $("version").textContent = "翻譯年糕 v" + (self.APP_VERSION || "?") + (server ? " · 服務 v" + server : "");
}
showVersion();
function updateUsage(u){
  if(u?.serverVersion) showVersion(u.serverVersion);
  if(!u || !u.tracking) return;
  $("usageCard").hidden = false;
  const rate = u.twdRate || 32;
  $("uToday").textContent = `${u.today} / ${u.dailyLimit} 次`;
  setMeter("mToday", u.dailyLimit ? u.today / u.dailyLimit : 0);
  const hasBudget = u.monthBudgetUSD > 0;
  $("uMonth").textContent = hasBudget
    ? `${ntd(u.monthCostUSD, rate)} / ${ntd(u.monthBudgetUSD, rate)}`
    : ntd(u.monthCostUSD, rate);
  setMeter("mMonth", hasBudget ? u.monthCostUSD / u.monthBudgetUSD : 0);
  $("mMonth").hidden = !hasBudget;
  $("uDetail").textContent = `本月共 ${u.monthRequests.toLocaleString()} 次、${u.monthTokens.toLocaleString()} tokens。費用為依官方價格的估算，實際以帳單為準。`;

  const dayR = u.dailyLimit ? u.today / u.dailyLimit : 0;
  const monR = hasBudget ? u.monthCostUSD / u.monthBudgetUSD : 0;
  const b = $("usageBanner");
  let msg = "";
  if(monR >= 1) msg = "本月的共用額度已經用完，翻譯暫停到下個月 1 號。";
  else if(dayR >= 1) msg = "今天的共用翻譯次數已經用完，明天會自動恢復。";
  else if(monR >= 0.8) msg = `本月額度已用 ${Math.round(monR*100)}%，剩下約 ${ntd(u.monthBudgetUSD - u.monthCostUSD, rate)}。`;
  else if(dayR >= 0.8) msg = `今天已用 ${u.today} 次，剩下 ${u.dailyLimit - u.today} 次。`;
  b.textContent = msg;
  b.hidden = !msg;
  b.classList.toggle("full", monR >= 1 || dayR >= 1);
}
function doneMsg(u, r){
  const name = e => e === "gemini" ? "Gemini" : "Claude";
  const fb = r?._fallbackFrom ? `${name(r._fallbackFrom)} 太忙，這次改用 ${name(r._engine)} 翻譯。` : "";
  const cost = u && u.lastCostUSD != null ? `完成，這次約 NT$${(u.lastCostUSD * (u.twdRate || 32)).toFixed(2)}` : "";
  return [fb, cost].filter(Boolean).join(" ");
}
async function loadUsage(){
  const pass = store.get("pass");
  if(!pass || !API_URL || API_URL.includes("YOUR-")) return;
  try{
    const res = await fetch(API_URL.replace(/\/translate$/, "/usage"), { headers: { "X-Pass": pass } });
    if(res.ok){ const d = await res.json(); updateUsage(d._usage); }
  }catch(e){}
}

async function callApi(payload){
  const pass = store.get("pass");
  if(!pass){ needPass(""); throw { code: "no_pass" }; }
  if(!API_URL || API_URL.includes("YOUR-")) throw { code: "server_not_ready" };
  let res;
  try{
    res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Pass": pass },
      body: JSON.stringify({ ...payload, engine: $("engine").value }),
    });
  }catch(e){ throw { code: "network" }; }
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(data?._usage) updateUsage(data._usage);
  if(data?.error === "no_credit"){ const b = $("usageBanner"); b.textContent = ERR.no_credit; b.classList.add("full"); b.hidden = false; }
  if(!res.ok){
    const code = data?.error || "network";
    if(code === "bad_pass"){ store.del("pass"); needPass(ERR.bad_pass); }
    const eng = data?.engine === "gemini" ? "Gemini" : data?.engine === "claude" ? "Claude" : "";
    const info = eng || data?.status ? `（${[eng, data?.status].filter(Boolean).join(" ")}${data?.detail ? "：" + data.detail : ""}）` : "";
    throw { code, info };
  }
  return data;
}
const msgFor = c => ERR[c] || "出了點問題，再試一次。";

/* ---------- 看懂對方 ---------- */
$("readBtn").onclick = async () => {
  const text = $("readText").value.trim();
  if(!text && !files.length){ status("read", "先貼上訊息或上傳截圖。", true); return; }
  $("readBtn").disabled = true;
  status("read", files.length ? "讀取截圖中，大約 5–15 秒…" : "翻譯中…");
  try{
    const maxTiles = files.length <= 2 ? 3 : 2;  // 全部最多 8 段
    const images = (await Promise.all(files.map(f => toTiles(f, maxTiles)))).flat().slice(0, 8);
    const r = await callApi({ mode: "read", text, images });
    if(!r || !Array.isArray(r.messages)) throw { code: "bad_output" };
    renderResult(r, false);
    lastLang = r.lang || lastLang;
    context = r.messages.slice(-6).map(m => `${m.side === "me" ? "我" : "對方"}：${m.original}`);
    status("read", doneMsg(r._usage, r));
  }catch(e){
    if(e?.code !== "no_pass") status("read", msgFor(e?.code || (e?.message === "image" ? "bad_request" : "")) + (e?.info || ""), true);
  }finally{
    $("readBtn").disabled = false;
  }
};

/* ---------- 回覆對方 ---------- */
$("replyBtn").onclick = async () => {
  const text = $("replyText").value.trim();
  if(!text){ status("reply", "先寫下你想說的話。", true); return; }
  const lang = $("lang").value === "auto" ? lastLang : $("lang").value;
  $("replyBtn").disabled = true;
  status("reply", "翻譯中…");
  try{
    const r = await callApi({ mode: "reply", text, lang, tone: $("tone").value, gender: $("gender").value, context });
    const opts = Array.isArray(r?.options) ? r.options : [];
    if(!opts.length) throw { code: "bad_output" };
    $("optLang").textContent = lang;
    setEngineTag("optEngine", r._engine);
    const box = $("opts"); box.innerHTML = "";
    opts.forEach(o => {
      const d = document.createElement("div"); d.className = "opt";
      const say = document.createElement("div"); say.className = "say"; say.textContent = o.text || "";
      d.append(say);
      if(o.roman){ const ro = document.createElement("div"); ro.className = "roman"; ro.textContent = o.roman; d.append(ro); }
      const back = document.createElement("div"); back.className = "back"; back.textContent = "意思：" + (o.back || ""); d.append(back);
      const b = document.createElement("button"); b.type = "button"; b.className = "btn ghost copy"; b.textContent = "複製";
      b.onclick = async () => {
        try{ await navigator.clipboard.writeText(o.text || ""); b.textContent = "已複製"; }
        catch(_){ const rg = document.createRange(); rg.selectNodeContents(say); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); b.textContent = "已選取，請手動複製"; }
        setTimeout(() => b.textContent = "複製", 1600);
      };
      d.append(b); box.append(d);
    });
    $("optCard").hidden = false;
    status("reply", doneMsg(r._usage, r));
  }catch(e){
    if(e?.code !== "no_pass") status("reply", msgFor(e?.code) + (e?.info || ""), true);
  }finally{
    $("replyBtn").disabled = false;
  }
};

/* ---------- Android 分享進來的內容 ---------- */
async function takeShared(){
  if(!new URLSearchParams(location.search).has("shared") || !("caches" in window)) return;
  history.replaceState(null, "", location.pathname);
  setTab("read");
  status("read", "收到分享的內容，準備翻譯…");
  try{
    const cache = await caches.open("share");
    const keys = await cache.keys();
    let meta = null, text = "";
    const got = [];
    for(const req of keys){
      const res = await cache.match(req);
      if(req.url.endsWith("/shared/meta")) meta = await res.json().catch(() => null);
      else if(req.url.endsWith("/shared/text")) text = await res.text();
      else { const blob = await res.blob(); got.push(new File([blob], "shared.jpg", { type: blob.type || "image/jpeg" })); }
    }
    // 分享的內容保留在快取裡（頁面重新載入也讀得到），用 id 避免同一次分享被自動翻兩次
    const seen = store.get("sharedId");
    const fresh = meta && String(meta.id) !== seen && Date.now() - meta.id < 5 * 60 * 1000;
    if(got.length){ files = []; addFiles(got); }
    if(text && !$("readText").value.trim()) $("readText").value = text;
    if(!got.length && !text){
      const why = meta ? `（收到 ${meta.files} 個檔案；欄位：${meta.fields.join(", ") || "無"}）` : "（沒有分享紀錄）";
      status("read", "沒有收到分享的截圖。請改用「上傳截圖」，並把這段訊息截圖給管理者：" + why, true);
      return;
    }
    if(!fresh){ status("read", "已載入分享的截圖，按「翻譯成中文」開始。"); return; }
    store.set("sharedId", String(meta.id));
    if(!store.get("pass")){ status("read", "先輸入通關密碼，再按「翻譯成中文」。", true); return; }
    $("readBtn").click();
  }catch(e){
    status("read", "讀取分享的截圖失敗，請改用「上傳截圖」。（" + (e?.message || e) + "）", true);
  }
}

/* ---------- 安裝提示 ---------- */
(function installTip(){
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if(standalone) return;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const tip = $("installTip");
  tip.textContent = ios
    ? "加到主畫面更好用：在 Safari 點下方「分享」→「加入主畫面」。"
    : "加到主畫面更好用：點瀏覽器選單 →「安裝應用程式」或「加到主畫面」。安裝後，截圖時按「分享」就能直接選「翻譯年糕」。";
  tip.hidden = false;
})();

if("serviceWorker" in navigator){
  // updateViaCache: none → 每次都檢查 sw.js 與 version.js 有沒有新版
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
    .then(reg => reg.update())
    .catch(() => {});
  // 新版接手時自動重新整理一次，讓畫面換成新版
  let reloaded = false;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if(!hadController || reloaded) return;
    reloaded = true;
    location.reload();
  });
}
// 從分享進來卻沒有被 service worker 接住時（GitHub Pages 會回 405），這個網址不會出現；
// 這裡只處理「有 ?shared 但 service worker 還沒啟用」的情況
if(new URLSearchParams(location.search).has("shared") && "serviceWorker" in navigator && !navigator.serviceWorker.controller){
  status("read", "App 剛更新，請關掉翻譯年糕後再分享一次。", true);
}
takeShared();
loadUsage();
</script>
